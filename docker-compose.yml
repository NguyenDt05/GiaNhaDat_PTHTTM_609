services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      HOUSE_API_ENVIRONMENT: development
      HOUSE_API_RATE_LIMIT_REQUESTS: 60
      HOUSE_API_RATE_LIMIT_WINDOW_SECONDS: 60
    ports:
      - "8000:8000"
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

